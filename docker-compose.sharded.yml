name: mongoscale-sharded

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  HTTP_PORT: "8080"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGO_URI: mongodb://mongos:27017
  MONGO_DATABASE: ${MONGO_DATABASE:-mongoscale}
  REDIS_ADDR: redis:6379
  JWT_SECRET: ${JWT_SECRET:-mongoscale-demo-jwt-secret-change-me}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mongoscale.dev}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
  BCRYPT_COST: ${BCRYPT_COST:-6}
  INITIAL_MODE: ${INITIAL_MODE:-sharded}
  REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-8000}
  MONGO_OP_TIMEOUT_MS: ${MONGO_OP_TIMEOUT_MS:-5000}
  SLOW_QUERY_THRESHOLD_MS: ${SLOW_QUERY_THRESHOLD_MS:-100}
  RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-30}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-60}
  SEED_USERS: ${SEED_USERS:-5000}
  SEED_PRODUCTS: ${SEED_PRODUCTS:-500}
  SEED_ORDERS: ${SEED_ORDERS:-50000}
  SEED_REVIEWS: ${SEED_REVIEWS:-100000}
  SEED_RESET: ${SEED_RESET:-false}
  SEED_SHARD_ORDERS: "true"
  SEED_BCRYPT_COST: ${SEED_BCRYPT_COST:-6}

x-mongod: &mongod
  image: mongo:7.0.14
  networks:
    - backend
  healthcheck:
    test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s
  deploy:
    resources:
      limits:
        cpus: "0.75"
        memory: 512M
  logging: *logging
  restart: unless-stopped

services:
  cfg1:
    <<: *mongod
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - cfg1_data:/data/configdb

  cfg2:
    <<: *mongod
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - cfg2_data:/data/configdb

  cfg3:
    <<: *mongod
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - cfg3_data:/data/configdb

  shard1a:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.3"]
    volumes:
      - shard1a_data:/data/db

  shard1b:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.3"]
    volumes:
      - shard1b_data:/data/db

  shard1c:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.3"]
    volumes:
      - shard1c_data:/data/db

  shard2a:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.3"]
    volumes:
      - shard2a_data:/data/db

  shard2b:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.3"]
    volumes:
      - shard2b_data:/data/db

  shard2c:
    <<: *mongod
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.3"]
    volumes:
      - shard2c_data:/data/db

  replica-init:
    image: mongo:7.0.14
    entrypoint: ["bash", "/scripts/init-cluster.sh"]
    volumes:
      - ./docker/mongodb/sharded-cluster:/scripts:ro
    depends_on:
      cfg1:
        condition: service_healthy
      cfg2:
        condition: service_healthy
      cfg3:
        condition: service_healthy
      shard1a:
        condition: service_healthy
      shard1b:
        condition: service_healthy
      shard1c:
        condition: service_healthy
      shard2a:
        condition: service_healthy
      shard2b:
        condition: service_healthy
      shard2c:
        condition: service_healthy
    networks:
      - backend
    logging: *logging
    restart: "no"

  mongos:
    image: mongo:7.0.14
    command: ["mongos", "--configdb", "cfgrs/cfg1:27017,cfg2:27017,cfg3:27017", "--port", "27017", "--bind_ip_all"]
    depends_on:
      replica-init:
        condition: service_completed_successfully
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging
    restart: unless-stopped

  shard-init:
    image: mongo:7.0.14
    entrypoint: ["mongosh", "--host", "mongos", "--quiet", "--file", "/scripts/add-shards.js"]
    volumes:
      - ./docker/mongodb/sharded-cluster:/scripts:ro
    depends_on:
      mongos:
        condition: service_healthy
    networks:
      - backend
    logging: *logging
    restart: "no"

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
    logging: *logging
    restart: unless-stopped

  seed:
    build:
      context: ./backend
    entrypoint: ["/app/seed"]
    environment:
      <<: *app-environment
    depends_on:
      shard-init:
        condition: service_completed_successfully
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1024M
    logging: *logging
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      <<: *app-environment
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    logging: *logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *logging
    restart: unless-stopped

networks:
  backend:
    name: mongoscale-sharded-backend
    driver: bridge

volumes:
  cfg1_data:
    name: mongoscale-sharded-cfg1
  cfg2_data:
    name: mongoscale-sharded-cfg2
  cfg3_data:
    name: mongoscale-sharded-cfg3
  shard1a_data:
    name: mongoscale-sharded-shard1a
  shard1b_data:
    name: mongoscale-sharded-shard1b
  shard1c_data:
    name: mongoscale-sharded-shard1c
  shard2a_data:
    name: mongoscale-sharded-shard2a
  shard2b_data:
    name: mongoscale-sharded-shard2b
  shard2c_data:
    name: mongoscale-sharded-shard2c
